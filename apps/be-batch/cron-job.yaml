apiVersion: batch/v1
kind: CronJob
metadata:
  name: be-batch-cron
  namespace: app
  labels:
    app: be-batch
spec:
  schedule: "0 0 31 2 *"        # 2월 31일 = 절대 안 옴 (suspend 백업)
  suspend: true                 # 스케줄 비활성 — 템플릿 용도
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0           # k8s 재시도 끔 (중복 실행 방지)
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: be-batch
          annotations:
            instrumentation.opentelemetry.io/inject-java: "platform-observability/java-instrumentation"
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: harbor-credentials
          containers:
            - name: be-batch
              image: harbor.platform.local/app/be-batch:f0faec14
              env:
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: http/protobuf
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: http://192.168.122.175:4318
                - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_LOG_ATTRIBUTES
                  value: "true"
                - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES
                  value: "*"
                - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_KEY_VALUE_PAIR_ATTRIBUTES
                  value: "true"
              # SPRING_BATCH_JOB_NAME 은 여기 안 넣음 — 실행 시 주입
              # TRACE_PARENT 도 여기 안 넣음 — on-demand 때 컨트롤러가 추가
              resources:
                requests: { cpu: "100m", memory: "256Mi" }
                limits:   { cpu: "500m", memory: "512Mi" }

