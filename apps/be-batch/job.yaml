apiVersion: batch/v1
kind: Job
metadata:
  name: be-batch-sample
  namespace: app
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: be-batch
      annotations:
        instrumentation.opentelemetry.io/inject-java: "platform-observability/java-instrumentation"
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-credentials
      containers:
        - name: be-batch
          image: harbor.platform.local/app/be-batch:latest
          args:
            - --spring.batch.job.name=sampleJob
          env:
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://192.168.122.175:4318
            - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_LOG_ATTRIBUTES
              value: "true"
            - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES
              value: "*"
            - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_KEY_VALUE_PAIR_ATTRIBUTES
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
