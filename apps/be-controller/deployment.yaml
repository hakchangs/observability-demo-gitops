apiVersion: apps/v1
kind: Deployment
metadata:
  name: be-controller
  namespace: app
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: be-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: be-controller
      annotations:
        instrumentation.opentelemetry.io/inject-java: "platform-observability/java-instrumentation"
    spec:
      serviceAccountName: be-controller-sa
      imagePullSecrets:
        - name: harbor-credentials
      containers:
        - name: be-controller
          image: harbor.platform.local/app/be-controller:651c2ffd
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_LOG_ATTRIBUTES
              value: "true"
            - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES
              value: "*"
            - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_KEY_VALUE_PAIR_ATTRIBUTES
              value: "true"
            - name: OTEL_JAVA_EXPERIMENTAL_SPAN_ATTRIBUTES_COPY_FROM_BAGGAGE_INCLUDE
              value: guid
            - name: REDIS_HOST
              value: redis-master
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 50
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 50
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "10m"
            limits:
              memory: "512Mi"
              cpu: "500m"
