apiVersion: v1
kind: ServiceAccount
metadata:
  name: be-controller-sa
  namespace: app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: be-controller-job-manager
  namespace: app
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]                    # jobTemplate 읽기용
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: be-controller-job-manager
  namespace: app
subjects:
  - kind: ServiceAccount
    name: be-controller-sa
    namespace: app
roleRef:
  kind: Role
  name: be-controller-job-manager
  apiGroup: rbac.authorization.k8s.io
